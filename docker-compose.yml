services:
  tomearr:
    build: .
    container_name: tomearr
    ports:
      # Host port: 8222 by default. To change it, set TOMEARR_PORT in a .env file next to this one.
      - "${TOMEARR_PORT:-8222}:8222"
    volumes:
      # SQLite database and settings. Keep this on cache/SSD if you can.
      - /mnt/user/appdata/tomearr/config:/config
      # Downloaded Open Library dumps (~13 GB with editions). Can live on the array.
      - /mnt/user/appdata/tomearr/data:/data
      # Your Calibre library (the folder with metadata.db), read-only: Tomearr only reads it until Phase 6.
      # To use a different folder, set CALIBRE_LIBRARY in .env instead of editing this file.
      - "${CALIBRE_LIBRARY:-/mnt/user/appdata/calibre/Calibre Library}:/calibre:ro"
      # Ingest (drop) folder: new and unsorted ebooks. Read-only while Tomearr only reports on it (Phase 4);
      # the import step (Phase 6) will need write access to move files out. Override with INGEST_FOLDER in .env.
      - "${INGEST_FOLDER:-/mnt/user/data/download/completed/ebooks}:/ingest:ro"
    restart: unless-stopped
