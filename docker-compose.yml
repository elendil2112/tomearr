services:
  tomearr:
    build: .
    container_name: tomearr
    ports:
      # Host port: set TOMEARR_PORT in a .env file next to this one (e.g. TOMEARR_PORT=8222). Default 8080.
      - "${TOMEARR_PORT:-8080}:8080"
    volumes:
      # SQLite database and settings. Keep this on cache/SSD if you can.
      - /mnt/user/appdata/tomearr/config:/config
      # Downloaded Open Library dumps (~13 GB with editions). Can live on the array.
      - /mnt/user/appdata/tomearr/data:/data
      # Added in later phases:
      # - /mnt/user/books/ingest:/ingest
      # - /mnt/user/books/calibre:/calibre
    restart: unless-stopped
